<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ऑफलाइन — हनुमान जी</title>
<meta name="theme-color" content="#7A2E2E" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Hind',sans-serif;
  background:linear-gradient(135deg,#7A2E2E,#3B0A0A);
  color:#F5E6D3;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.box{max-width:400px}
.emoji{font-size:100px;display:block;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(212,175,55,.8))}
h1{
  font-family:'Tiro Devanagari Hindi',serif;
  font-size:32px;
  color:#F4D160;
  margin-bottom:16px;
}
p{font-size:15px;line-height:1.8;margin-bottom:24px}
button{
  padding:14px 32px;
  background:linear-gradient(135deg,#FF6B35,#D4AF37);
  color:#fff;
  border:none;
  border-radius:30px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}
</style>
</head>
<body>
<div class="box">
  <span class="emoji">🐒</span>
  <h1>ऑफलाइन</h1>
  <p>आप ऑफलाइन हैं। कृपया इंटरनेट से जुड़ें।</p>
  <p style="font-size:20px;font-family:'Tiro Devanagari Hindi',serif;color:#F4D160;">
    🙏 जय श्री राम 🙏
  </p>
  <button onclick="location.reload()">
    <i class="fa-solid fa-rotate-right"></i> फिर कोशिश करें
  </button>
</div>
</body>
</html>
